<body>
  <header class="site-header">

      <a href="#/" class="logo" aria-label="Nova home">
        <span class="logo-img"><img src="logo.jpg" alt="Nova logo" width="44" height="44"></span><span class="logo-text">nova<i>.</i></span>
      </a>

      <form class="header-search" id="headerSearch" role="search">
        <svg class="icon" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 015.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z"/></svg>
        <input type="search" name="q" placeholder="Search events" aria-label="Search events">
        <span class="divider"></span>

        <button type="submit" class="search-btn" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 015.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z"/></svg></button>

      <button class="menu-toggle" id="menuToggle" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16v2H4zm0 4h16v2H4zm0 4h16v2H4z"/></svg></button>
    </div>

  <main id="app" tabindex="-1"></main>

      <a href="#/" class="logo logo-sm" aria-label="Nova home"><span class="logo-img sm"><img src="logo.jpg" alt="" width="28" height="28"></span><span class="logo-text">nova<i>.</i></span></a>
      <nav class="footer-links"><a href="#/about">About</a><a href="#/pricing">Pricing</a><a href="#/help">Help</a><a href="#/terms">Terms</a><a href="#/privacy">Privacy</a></nav>
      <span class="footer-copy">© <span id="year"></span> Nova · Photos: <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a></span>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
